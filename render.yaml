services:
  - type: web
    name: marketplace-comision-mercadopago
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: marketplace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: COMMISSION_PERCENT
        value: "3"
      - key: PORT
        value: "3000"
      - key: DATA_DIR
        value: /var/data
